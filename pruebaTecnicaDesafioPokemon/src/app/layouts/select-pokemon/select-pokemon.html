
<div class="bg-white p-6 md:p-10">
  <div class="mx-auto max-w-7xl">
    <div class="mb-8">
      <h1 class="text-2xl font-bold text-sky-800">
        Pokémon
      </h1>

      <p class="mt-2 text-slate-500">
        Selecciona 3 Pokémon para que sean parte de tu equipo
      </p>
    </div>

    @if (error()) {
      <div class="rounded-lg bg-red-50 p-4 text-red-600">
        {{ error() }}
      </div>
    } @else {
      <div class="grid grid-cols-3 gap-4 overflow-y-auto w-4/5 h-96">
        @for (item of pokemon(); track item.id) {
          <div class="rounded-xl p-4 text-center transition hover:-translate-y-1 hover:cursor-pointer"
            [class.bg-yellow-400]="isSelected(item.id)"
            [class.bg-slate-50]="!isSelected(item.id)"
            [attr.aria-pressed]="isSelected(item.id)"
            [ngClass]="{'cursor-not-allowed opacity-50':isSelectionLimitReached() && !isSelected(item.id)}"
            (click)="togglePokemon(item)"
          >
            <img
              [src]="item.image"
              [alt]="item.name"
              class="mx-auto my-3 aspect-square w-full max-w-24 object-contain"
              loading="lazy"
            />

            <div class="flex flex-row justify-center items-center gap-2 rounded-xl font-bold bg-sky-900 text-white text-xs py-1">
                <span>
                #{{ item.id.toString().padStart(3, '0') }}
                </span>
                <span class="capitalize">
                {{ item.name }}
                </span>
            </div>
        </div>
        }
      </div>
      <div class="w-full flex flex-row justify-center items-center pr-10 mt-10">
        <p-button label="Guardar" [disabled]="!isSelectionLimitReached()" styleClass="!bg-sky-900 !w-48" (onClick)="submitPokemon()"/>
      </div>
    }
  </div>
</div>
