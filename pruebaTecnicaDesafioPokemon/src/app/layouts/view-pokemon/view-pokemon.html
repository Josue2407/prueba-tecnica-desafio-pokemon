@if (error()) {
  <p class="text-center text-red-600">
    {{ error() }}
  </p>
} @else {
    <div class="flex flex-row justify-between w-4/5 mt-10">
        <h1 class="text-2xl font-bold text-sky-800">
        Mis Pokémon
        </h1>
        <p-button label="Editar" variant="outlined" styleClass="!border !border-2 !border-sky-900 !text-sky-900 !text-xs !w-30 !rounded-2xl" (onClick)="modificarPokemons()" />
    </div>
    <div class="grid grid-cols-1 gap-6 w-4/5 h-96 overflow-y-auto mt-5">
    @for (pokemon of pokemonStats(); track pokemon.id) {
        <article class="rounded-xl bg-slate-50 p-5 flex flex-row">
        <div class="mb-5 flex flex-col items-center justify-end gap-3 w-1/3">
            <img
            [src]="'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/' + pokemon.id + '.png'"
            [alt]="pokemon.name"
            class="h-36 w-36 object-contain"
            />

            <div>
            <h2 class="text-lg font-bold capitalize text-slate-800">
                {{ pokemon.name }}
            </h2>
            <p class="text-sm text-slate-400">
                #{{ pokemon.id.toString().padStart(3, '0') }}
            </p>
            </div>
        </div>

        <div class="space-y-2 w-2/3">
            @for (stat of pokemon.stats; track stat.stat.name) {
            <div>
                <div class="mb-1 flex justify-between text-sm">
                <span class="capitalize text-slate-600">
                    {{ stat.stat.name.replace('-', ' ') }}
                </span>
                </div>

                <div
                class="h-2.5 w-full overflow-hidden rounded-full bg-slate-200"
                role="progressbar"
                [attr.aria-label]="stat.stat.name"
                [attr.aria-valuenow]="stat.base_stat"
                aria-valuemin="0"
                aria-valuemax="255"
                >
                <div
                    class="h-full rounded-full bg-green-500 transition-all duration-500"
                    [style.width.%]="Math.min(stat.base_stat / 255 * 100, 100)"
                ></div>
                </div>
            </div>
            }
        </div>
        </article>
    }
    </div>
}
