<div class="sticky top-0 w-full">
  <app-header></app-header>
</div>
<div class="flex flex-row justify-center items-start gap-2">
  <div class="w-1/2">
    <app-profile></app-profile>
  </div>
  <div class="w-1/2">
    @switch (flowStateService.currentState()) {
      @case (flowState.Initial) {
        <app-form-profile></app-form-profile>
      }
      @case(flowState.InformationSaved) {
        <app-select-pokemon></app-select-pokemon>
      }
      @case (flowState.Confirmation) {
        <app-view-pokemon></app-view-pokemon>
      }
    }
    
  </div>
</div>
